name: Refresh brief data

on:
  schedule:
    # Every 20 minutes. GitHub cron is UTC and can run a few minutes late —
    # that is fine, the app shows how old the data actually is.
    - cron: "*/20 * * * *"
  workflow_dispatch:        # lets you hit "Run workflow" by hand
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r scripts/requirements.txt

      # Guard: if a parser has silently broken, fail the build here rather
      # than committing an empty brief.
      - name: Test parsers
        run: python scripts/test_parsers.py

      # Country outlines for the world map. Downloads once, then skips on
      # every later run. Allowed to fail: the map is a nice-to-have, the
      # brief is not.
      - name: Build world map (first run only)
        continue-on-error: true
        run: python scripts/build_map.py

      - name: Collect
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: python scripts/fetch_all.py

      - name: Commit if changed
        run: |
          git config user.name  "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add data/brief.json
          if [ -f data/world.json ]; then git add data/world.json; fi
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "data: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
